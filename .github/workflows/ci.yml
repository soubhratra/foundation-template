name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foundation_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/pyproject.toml"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: cd apps/api && uv sync

      - name: Run detect-secrets scan
        run: cd apps/api && uv run detect-secrets scan --baseline ../../.secrets.baseline

      - name: Run bandit security scan
        run: cd apps/api && uv run bandit -r apps/ -lll -x tests/

      - name: Run pip-audit
        run: |
          # Read ignore list from .pip-audit-ignore (one CVE ID per line, # comments allowed)
          IGNORE_ARGS=""
          if [ -f ".pip-audit-ignore" ]; then
            while IFS= read -r line; do
              [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue
              IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $line"
            done < ".pip-audit-ignore"
          fi
          cd apps/api && uv run pip-audit $IGNORE_ARGS

      - name: Run ruff lint
        run: cd apps/api && uv run ruff check .

      - name: Run ruff format check
        run: cd apps/api && uv run ruff format --check .

      - name: Run mypy type check
        run: cd apps/api && uv run mypy apps/

      - name: Run migrations
        run: cd apps/api && uv run python manage.py migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foundation_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"

      - name: Run pytest
        run: cd apps/api && uv run pytest --cov --cov-report=xml
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foundation_test
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/api/coverage.xml
          flags: api
        continue-on-error: true

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level high

      - name: Build dependencies
        run: pnpm turbo build --filter=@repo/web^...

      - name: Run eslint
        run: pnpm turbo lint --filter=@repo/web

      - name: Run type check
        run: pnpm turbo type-check --filter=@repo/web

      - name: Run tests
        run: pnpm turbo test --filter=@repo/web

      - name: Build app
        run: pnpm turbo build --filter=@repo/web

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm turbo build --filter=foundation-mobile^...

      - name: Run eslint
        run: pnpm turbo lint --filter=foundation-mobile

      - name: Run type check
        run: pnpm turbo type-check --filter=foundation-mobile

      - name: Run Expo type check
        run: cd apps/mobile && pnpm expo export --platform ios --dev --output-dir .expo-export-check
        continue-on-error: true

      # Note: Detox E2E tests require macOS runners with iOS simulator
      # Skipping for Ubuntu runner - see separate workflow if needed

  schemathesis:
    name: API Contract Fuzzing (schemathesis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foundation_schemathesis
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/pyproject.toml"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: cd apps/api && uv sync

      - name: Run migrations
        run: cd apps/api && uv run python manage.py migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foundation_schemathesis # pragma: allowlist secret
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"

      - name: Start Django dev server in background
        run: |
          cd apps/api && uv run python manage.py runserver 8000 &
          echo "Django server PID: $!"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foundation_schemathesis # pragma: allowlist secret
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          DJANGO_SETTINGS_MODULE: config.settings.development

      - name: Wait for Django server to be ready
        run: |
          echo "Waiting for Django server..."
          for i in $(seq 1 30); do
            if wget -q -O /dev/null http://127.0.0.1:8000/api/openapi.json 2>/dev/null; then
              echo "Django server is ready (attempt $i)"
              break
            fi
            echo "Attempt $i/30 -- server not ready yet, retrying in 2s"
            sleep 2
          done
          wget -q -O /dev/null http://127.0.0.1:8000/api/openapi.json || (echo "Django server failed to start" && exit 1)

      - name: Run schemathesis contract fuzzing
        run: |
          cd apps/api && uv run schemathesis run \
            http://127.0.0.1:8000/api/openapi.json \
            --checks all \
            --exclude-path /api/billing/webhook/ \
            --exclude-path "/api/health/" \
            --exclude-path "/api/v1/auth/" \
            --max-response-time 5000 \
            --hypothesis-max-examples 30
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/foundation_schemathesis # pragma: allowlist secret
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"

  e2e-smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Flake handling: Playwright retries each test up to 2 times in CI (playwright.config.ts).
    # GitHub Actions has no native timeout-based job retry; workflow-level retry is handled
    # by re-running failed jobs manually via the Actions UI or gh CLI.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Start Docker Compose
        run: docker compose up -d

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/api/health/ready; do sleep 2; done'
          echo "API ready."

      - name: Install Python dependencies
        run: |
          cd apps/api
          pip install uv
          uv sync

      - name: Run migrations
        run: |
          cd apps/api
          python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development

      - name: Seed test users
        run: |
          cd apps/api
          python manage.py shell -c "
          from django.contrib.auth import get_user_model
          from allauth.account.models import EmailAddress
          User = get_user_model()
          if not User.objects.filter(email='e2e@example.com').exists():
              user = User.objects.create_user(email='e2e@example.com', password='E2EPassword123!')
              EmailAddress.objects.create(user=user, email='e2e@example.com', primary=True, verified=True)
          if not User.objects.filter(email='e2e-admin@example.com').exists():
              admin = User.objects.create_user(email='e2e-admin@example.com', password='E2EPassword123!', is_staff=True)
              EmailAddress.objects.create(user=admin, email='e2e-admin@example.com', primary=True, verified=True)
          print('Test users seeded.')
          "
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development

      - name: Install web dependencies
        run: pnpm install --filter web

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install chromium

      - name: Start web app
        run: |
          pnpm --filter web build
          pnpm --filter web start &
          timeout 30 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done'
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Run smoke tests
        run: pnpm --filter web exec playwright test tests/e2e/auth.spec.ts tests/e2e/health.spec.ts
        env:
          BASE_URL: http://localhost:3000
          E2E_USER_EMAIL: e2e@example.com
          E2E_USER_PASSWORD: E2EPassword123! # pragma: allowlist secret

      - name: Write passing FAILURES.md
        if: success()
        run: |
          mkdir -p test-results
          printf "## Failed Tests — %s\n\n| Test | File | Assertion | Requirements | Status |\n|------|------|-----------|--------------|--------|\n\n_All smoke tests passed._\n" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > test-results/FAILURES.md

      - name: Upload FAILURES.md artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-failures
          path: test-results/FAILURES.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down Docker Compose
        if: always()
        run: docker compose down -v
