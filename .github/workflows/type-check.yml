name: Type Staleness Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-types:
    name: Check OpenAPI Type Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check TypeScript type freshness
        run: node scripts/check-openapi-freshness.mjs
