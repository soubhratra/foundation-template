repos:
  # Python quality (ruff replaces black + flake8 + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix] # Auto-fix linting issues
      - id: ruff-format # Format Python code

  # JS/TS quality (via lint-staged to scope to changed files only)
  - repo: local
    hooks:
      - id: lint-staged
        name: lint-staged
        entry: pnpm lint-staged
        language: system
        pass_filenames: false

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  # Secret detection — blocks secrets at commit time (DEV-01)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # Python security linting — HIGH severity only, excludes tests/ (DEV-02)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-lll", "-x", "tests/"]
        files: ^apps/

  # Conventional Commits enforcement — blocks non-conventional commit messages (DEV-07)
  # NOTE: requires `pre-commit install --hook-type commit-msg` in addition to `pre-commit install`
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - refactor
          - test
          - chore
          - perf
          - ci
          - build
          - revert
