<!-- SUBJECT: Your invoice is ready -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #333; margin: 0; padding: 0; background-color: #f5f5f5; }
  .wrapper { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
  .header { text-align: center; padding-bottom: 24px; border-bottom: 1px solid #e5e5e5; margin-bottom: 32px; }
  .app-name { font-size: 20px; font-weight: 600; color: #111; }
  .content { background: #fff; border-radius: 8px; padding: 32px; }
  .footer { margin-top: 32px; text-align: center; font-size: 12px; color: #999; }
  .button { display: inline-block; background-color: #000; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: 500; margin: 16px 0; }
  .invoice-ref { font-family: monospace; background: #f5f5f5; padding: 4px 8px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header"><div class="app-name">{{ app_name|default:"Your App" }}</div></div>
  <div class="content">
    <h2>Your invoice is ready</h2>
    <p>Invoice <span class="invoice-ref">{{ invoice_id }}</span> is now available for download.</p>
    <p><a href="{{ download_url }}" class="button">Download Invoice</a></p>
  </div>
  <div class="footer"><p>You are receiving this because you have an account.</p></div>
</div>
</body>
</html>
