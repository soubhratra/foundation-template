[project]
name = "foundation-api"
version = "0.1.0"
description = "Foundation Template Django API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "django-ninja-extra>=0.21",
    "django-environ>=0.11",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.7",
    "gunicorn>=22.0",
    "django-allauth>=65.14.3",
    "pyjwt>=2.11.0",
    "cryptography>=46.0.5",
    "requests>=2.32.5",
    "pgvector>=0.4.2",
    "tiktoken>=0.12.0",
    "celery[redis]>=5.6.2",
    "django-celery-results>=2.6.0",
    "openai>=2.21.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py"]
python_paths = ["."]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.django-stubs]
django_settings_module = "config.settings.development"
