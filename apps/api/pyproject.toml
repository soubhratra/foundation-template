[project]
name = "foundation-api"
version = "0.1.0"
description = "Foundation Template Django API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "django-ninja-extra>=0.21",
    "django-environ>=0.11",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.7",
    "gunicorn>=22.0",
    "django-allauth>=65.14.3",
    "pyjwt>=2.11.0",
    "cryptography>=46.0.5",
    "requests>=2.32.5",
    "pgvector>=0.4.2",
    "tiktoken>=0.12.0",
    "celery[redis]>=5.6.2",
    "django-celery-results>=2.6.0",
    "openai>=2.21.0",
    "langgraph>=1.0.8",
    "langchain-core>=1.2.13",
    "langchain-openai>=1.1.9",
    "weasyprint>=62.0,<70",
    "jinja2>=3.1",
    "structlog>=25.5.0",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40.0",
    "django-structlog[celery]>=10.0",
    "opentelemetry-instrumentation-django>=0.60b0",
    "opentelemetry-instrumentation-celery>=0.60b0",
    "opentelemetry-instrumentation-psycopg>=0.60b0",
    "posthog>=7.9.0",
    "django-celery-beat>=2.7",
    "flower>=2.0",
    "django-redis==6.0.0",
    "django-ratelimit==4.1.0",
    "django-csp==4.0",
    "nplusone>=1.0",
    "django-anymail[resend]>=14.0",
    "premailer>=3.10.0",
    "httpx>=0.27,<1",
    "django-pghistory>=3.9.2",
    "django-unfold>=0.84.0",
    "django-hijack>=3.7.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "pre-commit>=4.0",
    "pytest-structlog>=1.2",
    "bandit>=1.9.4",
    "pip-audit>=2.10.0",
    "django-debug-toolbar>=6.2.0",
    "schemathesis>=3.39",
    "detect-secrets>=1.5",
]
billing = [
    "stripe>=14.4,<15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py"]
python_paths = ["."]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.ruff.lint]
select = ["E", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
