services:
  db:
    image: pgvector/pgvector:pg16
    shm_size: 1gb
    command: postgres -c maintenance_work_mem=256MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foundation}
      POSTGRES_USER: ${POSTGRES_USER:-foundation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foundation}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foundation}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI — open http://localhost:16686
      - "4317:4317" # OTLP gRPC ingest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  postgres_data:
