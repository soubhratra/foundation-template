services:
  db:
    image: pgvector/pgvector:pg16
    shm_size: 1gb
    command: postgres -c maintenance_work_mem=256MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foundation}
      POSTGRES_USER: ${POSTGRES_USER:-foundation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foundation}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foundation}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI — open http://localhost:16686
      - "4317:4317" # OTLP gRPC ingest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  celery-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A config worker -l info
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foundation}:${POSTGRES_PASSWORD:-foundation}@db:5432/${POSTGRES_DB:-foundation}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-production}
      DEBUG: ${DEBUG:-True}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foundation}:${POSTGRES_PASSWORD:-foundation}@db:5432/${POSTGRES_DB:-foundation}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me-in-production}
      DEBUG: ${DEBUG:-True}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
    # Flower is dev-only — does NOT appear in docker-compose.prod.yml

volumes:
  postgres_data:
